<!doctype html>
<html lang="ky">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Сүрөттөр — Үй-бүлөлүк дасторкон</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: block; padding: 32px 16px; }
    .gallery-wrap { max-width: 1100px; margin: 0 auto; }
    .gallery-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      background: var(--card); border-radius: 14px; padding: 14px 20px; margin-bottom: 18px;
      outline: 2px solid var(--gold); outline-offset: -6px;
    }
    .gallery-head h1 { margin: 0; font-size: 2.2rem; }
    .back { color: var(--wine); font-weight: 700; text-decoration: none; border-bottom: 1px solid var(--gold); }
    .grid {
      display: grid; gap: 10px;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr));
    }
    .grid button {
      padding: 0; border: 3px solid var(--gold); border-radius: 10px; overflow: hidden;
      background: #2b1a14; cursor: zoom-in; aspect-ratio: 4 / 3;
    }
    .grid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s ease; }
    .grid button:hover img { transform: scale(1.05); }

    .lightbox {
      position: fixed; inset: 0; z-index: 10;
      background: rgba(20, 4, 8, 0.94);
      display: none; align-items: center; justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 94vw; max-height: 86vh; border-radius: 8px; box-shadow: 0 10px 40px #000; }
    .lightbox .nav { position: fixed; }
    .lightbox .close {
      position: fixed; top: 12px; right: 12px;
      width: 42px; height: 42px; border: 0; border-radius: 50%;
      background: rgba(255, 248, 236, 0.9); color: var(--wine); font-size: 1.6rem; cursor: pointer;
    }
    .lightbox .counter { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; color: var(--gold-soft); }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-layer"></div>
    <div class="bg-layer"></div>
  </div>
  <div class="gallery-wrap">
    <header class="gallery-head">
      <h1>Сүрөттөр</h1>
      <a class="back" href="index.html">← Чакырууга кайтуу</a>
    </header>
    <div id="grid" class="grid"></div>
  </div>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Сүрөт">
    <img id="lb-img" alt="">
    <button class="nav prev" type="button" aria-label="Мурунку сүрөт">‹</button>
    <button class="nav next" type="button" aria-label="Кийинки сүрөт">›</button>
    <button class="close" type="button" aria-label="Жабуу">×</button>
    <div class="counter" id="lb-counter"></div>
  </div>

  <script src="photos.js"></script>
  <script src="bg.js"></script>
  <script>
    (function () {
      const photos = window.PHOTOS || [];
      const grid = document.getElementById("grid");
      const lb = document.getElementById("lightbox");
      const lbImg = document.getElementById("lb-img");
      const counter = document.getElementById("lb-counter");
      let idx = 0;

      photos.forEach((file, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.setAttribute("aria-label", "Сүрөт " + (i + 1) + " ачуу");
        const img = document.createElement("img");
        img.src = "photos/" + file;
        img.decoding = "async";
        img.alt = "Үй-бүлөлүк сүрөт " + (i + 1);
        img.loading = "lazy";
        b.appendChild(img);
        b.addEventListener("click", () => open(i));
        grid.appendChild(b);
      });

      function open(i) {
        idx = (i + photos.length) % photos.length;
        lbImg.src = "photos/" + photos[idx];
        lbImg.alt = "Үй-бүлөлүк сүрөт " + (idx + 1);
        counter.textContent = (idx + 1) + " / " + photos.length;
        lb.classList.add("open");
      }
      function close() { lb.classList.remove("open"); }

      lb.querySelector(".prev").addEventListener("click", e => { e.stopPropagation(); open(idx - 1); });
      lb.querySelector(".next").addEventListener("click", e => { e.stopPropagation(); open(idx + 1); });
      lb.querySelector(".close").addEventListener("click", close);
      lb.addEventListener("click", e => { if (e.target === lb) close(); });
      document.addEventListener("keydown", e => {
        if (!lb.classList.contains("open")) return;
        if (e.key === "Escape") close();
        if (e.key === "ArrowLeft") open(idx - 1);
        if (e.key === "ArrowRight") open(idx + 1);
      });
      let sx = null;
      lb.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
      lb.addEventListener("touchend", e => {
        if (sx === null) return;
        const dx = e.changedTouches[0].clientX - sx;
        if (Math.abs(dx) > 40) open(idx + (dx < 0 ? 1 : -1));
        sx = null;
      });
    })();
  </script>
</body>
</html>
