<!doctype html>
<html lang="ky">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Үй-бүлөлүк дасторкон — 21-ноябрь</title>
    <meta
      name="description"
      content="Үй-бүлөлүк дасторконго чакыруу, 21-ноябрь, 12:00–16:00"
    />
    <meta property="og:title" content="Үй-бүлөлүк дасторконго чакырабыз!" />
    <meta
      property="og:description"
      content="21-ноябрь · 12:00–16:00. Келе турганыңызды белгилеңиз."
    />
    <meta property="og:image" content="photos/DSC03914.JPG" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lobster&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg-layer"></div>
      <div class="bg-layer"></div>
    </div>

    <main class="card">
      <p class="eyebrow">Урматтуу туугандар!</p>
      <h1>Үй-бүлөлүк дасторконго чакырабыз</h1>
      <div class="divider" aria-hidden="true">❦</div>

      <a class="gallery-link" href="gallery.html">Бүт сүрөттөр →</a>

      <ul class="details">
        <li>
          <span class="label">Күнү</span>
          <span class="value">21-ноябрь, ишемби</span>
        </li>
        <li>
          <span class="label">Убактысы</span>
          <span class="value">12:00 – 16:00</span>
        </li>
        <li>
          <span class="label">Дареги</span>
          <a
            class="value map-link"
            href="https://go.2gis.com/WNesA"
            target="_blank"
            rel="noopener"
            >2ГИС картасынан ачуу ↗</a
          >
        </li>
      </ul>

      <p class="invite-text">Баарыңарды чогуу көрүүгө абдан кубанычтабыз!</p>

      <form id="rsvp" class="rsvp" autocomplete="on">
        <label for="name-0">Атыңыз</label>
        <div id="names" class="names">
          <input
            id="name-0"
            class="name-input"
            type="text"
            maxlength="60"
            placeholder="Мисалы: Айгерим"
          />
        </div>
        <button type="button" id="add-name" class="add-name">
          + Дагы бирөөнү кошуу
        </button>

        <div class="buttons">
          <button type="submit" value="yes" class="btn yes">Барам</button>
          <button type="submit" value="no" class="btn no">Бара албайм</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script src="config.js"></script>
    <script src="photos.js"></script>
    <script src="bg.js"></script>
    <script src="script.js"></script>
  </body>
</html>
